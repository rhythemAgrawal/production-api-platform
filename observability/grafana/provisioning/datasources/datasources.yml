apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy                      # Grafana queries from its backend, not the browser
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s                # matches your scrape interval
      # The magic that makes Prometheus → Jaeger click-through work:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger        # must match the UID below

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://localhost:16686
    jsonData:
      # Wires the reverse direction: from a trace in Jaeger, jump back to
      # the matching metrics in Prometheus filtered by service.name.
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
