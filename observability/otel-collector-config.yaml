receivers:
  otlp:
    protocols:
      grpc:
        # 0.0.0.0, not localhost: the API runs in another container.
        endpoint: 0.0.0.0:4320

processors:
  batch:

exporters:
  otlp:
    endpoint: jaeger:4317
    tls:
      insecure: true
  
  # Metrics: re-expose as a Prometheus scrape target on :9464.
  prometheus:
    endpoint: 0.0.0.0:9464
    # Keeps OTel resource attributes (service.name, env) as Prometheus labels.
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
    
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]